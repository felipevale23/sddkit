name: test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Também roda os cenários de rede (Spec Kit, npx skills, npm commitlint)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest tests -q

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: pip install pytest
      - run: python -m pytest tests -q
        env:
          SDDKIT_E2E: "1"
